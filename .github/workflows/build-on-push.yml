name: Build Promantis Support Tool on Push
run-name: Build Promantis Support Tool (push to master)
on:
  push:
    branches: [master]

concurrency:
  group: build-on-push
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      custom: ${{ steps.config.outputs.custom }}
      extras: ${{ steps.config.outputs.extras }}
      uuid: ${{ steps.config.outputs.uuid }}
      key: ${{ steps.config.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate build configuration
        id: config
        env:
          PERMANENT_PASSWORD: ${{ secrets.PERMANENT_PASSWORD }}
          PERMANENT_PASSWORD_SALT: ${{ secrets.PERMANENT_PASSWORD_SALT }}
          RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PERMANENT_PASSWORD}" ]; then
            echo "Missing repository secret PERMANENT_PASSWORD" >&2
            exit 1
          fi
          if [ -z "${PERMANENT_PASSWORD_SALT}" ]; then
            echo "Missing repository secret PERMANENT_PASSWORD_SALT (32 hex chars, same as local .env)" >&2
            exit 1
          fi
          KEY="${RUSTDESK_KEY:-CctpHu85Bw1iuBwgZTATOjntfQkmqYc1yvs5m2pN+Vk=}"
          CUSTOM=$(python3 custom_config.py)
          UUID=$(python3 -c "import uuid; print(uuid.uuid4())")
          COMPANY_URL="${{ vars.COMPANY_URL }}"
          DOWNLOAD_URL="${{ vars.DOWNLOAD_URL }}"
          COMPANY_URL="${COMPANY_URL:-https://promantis.de}"
          DOWNLOAD_URL="${DOWNLOAD_URL:-https://supporttool.promantis.de}"
          EXTRAS="{\"version\":\"1.4.6\",\"rdgen\":\"true\",\"compname\":\"Promantis\",\"slogan\":\"professionell. progressiv. proaktiv.\",\"delayFix\":\"false\",\"cycleMonitor\":\"false\",\"xOffline\":\"false\",\"hidecm\":\"false\",\"statussort\":\"false\",\"removeNewVersionNotif\":\"false\",\"urlLink\":\"${COMPANY_URL}\",\"downloadLink\":\"${DOWNLOAD_URL}\"}"
          echo "custom=$CUSTOM" >> $GITHUB_OUTPUT
          echo "extras=$EXTRAS" >> $GITHUB_OUTPUT
          echo "uuid=$UUID" >> $GITHUB_OUTPUT
          echo "key=$KEY" >> $GITHUB_OUTPUT

  build-windows:
    needs: prepare
    uses: ./.github/workflows/generator-windows.yml
    with:
      server: ${{ vars.RUSTDESK_SERVER != '' && vars.RUSTDESK_SERVER || 'rustdesk.promantis.de' }}
      key: ${{ needs.prepare.outputs.key }}
      apiServer: ${{ vars.RUSTDESK_API_SERVER != '' && vars.RUSTDESK_API_SERVER || 'https://rustdesk.promantis.de' }}
      custom: ${{ needs.prepare.outputs.custom }}
      uuid: ${{ needs.prepare.outputs.uuid }}
      iconlink: ${{ vars.LOGO_URL != '' && vars.LOGO_URL || 'false' }}
      logolink: ${{ vars.LOGO_URL != '' && vars.LOGO_URL || 'false' }}
      appname: "Promantis Support Tool"
      filename: "promantis_support_tool"
      extras: ${{ needs.prepare.outputs.extras }}
      artifact-prefix: "win-"
    secrets: inherit

  build-linux:
    needs: prepare
    uses: ./.github/workflows/generator-linux.yml
    with:
      server: ${{ vars.RUSTDESK_SERVER != '' && vars.RUSTDESK_SERVER || 'rustdesk.promantis.de' }}
      key: ${{ needs.prepare.outputs.key }}
      apiServer: ${{ vars.RUSTDESK_API_SERVER != '' && vars.RUSTDESK_API_SERVER || 'https://rustdesk.promantis.de' }}
      custom: ${{ needs.prepare.outputs.custom }}
      uuid: ${{ needs.prepare.outputs.uuid }}
      iconlink: ${{ vars.LOGO_URL != '' && vars.LOGO_URL || 'false' }}
      logolink: ${{ vars.LOGO_URL != '' && vars.LOGO_URL || 'false' }}
      appname: "Promantis Support Tool"
      filename: "promantis_support_tool"
      extras: ${{ needs.prepare.outputs.extras }}
      artifact-prefix: "linux-"
    secrets: inherit

  build-macos:
    needs: prepare
    uses: ./.github/workflows/generator-macos.yml
    with:
      server: ${{ vars.RUSTDESK_SERVER != '' && vars.RUSTDESK_SERVER || 'rustdesk.promantis.de' }}
      key: ${{ needs.prepare.outputs.key }}
      apiServer: ${{ vars.RUSTDESK_API_SERVER != '' && vars.RUSTDESK_API_SERVER || 'https://rustdesk.promantis.de' }}
      custom: ${{ needs.prepare.outputs.custom }}
      uuid: ${{ needs.prepare.outputs.uuid }}
      iconlink: ${{ vars.LOGO_URL != '' && vars.LOGO_URL || 'false' }}
      logolink: ${{ vars.LOGO_URL != '' && vars.LOGO_URL || 'false' }}
      appname: "Promantis Support Tool"
      filename: "promantis_support_tool"
      extras: ${{ needs.prepare.outputs.extras }}
      artifact-prefix: "macos-"
    secrets: inherit
