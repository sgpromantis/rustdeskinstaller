name: Harden permanent password storage
description: Patch RustDesk 1.4.6 so custom.txt passwords are hashed verifiers, not plaintext
runs:
  using: composite
  steps:
    - name: Apply hashed password source patch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        SCRIPT=""
        for candidate in \
          _installer/.github/patches/harden_permanent_password.py \
          .github/patches/harden_permanent_password.py \
          harden_permanent_password.py
        do
          if [ -f "$candidate" ]; then
            SCRIPT="$candidate"
            break
          fi
        done
        if [ -z "$SCRIPT" ]; then
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/patches/harden_permanent_password.py?ref=${GITHUB_SHA}" \
            -o harden_permanent_password.py
          SCRIPT=harden_permanent_password.py
        fi
        if command -v python3 >/dev/null 2>&1; then
          python3 "$SCRIPT"
        else
          python "$SCRIPT"
        fi
